<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD to Social — Instagram Carousel Creator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Marked Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- SnapDOM for High-Res Pixel-Perfect DOM Image Export -->
  <script src="https://unpkg.com/@zumer/snapdom/dist/snapdom.js"></script>

  <!-- JSZip & FileSaver for Zip Export -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- Unified Styles from input.css -> output.css -->
  <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-[#16181b] text-[#f8f9fa] flex flex-col h-screen overflow-hidden select-none">

  <!-- Header -->
  <header class="h-14 bg-[#1c1f24] border-b border-[#2c3138] px-5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded bg-[#fd8d0d] flex items-center justify-center font-black text-[#212529] text-xs">
        MD
      </div>
      <h1 class="font-bold text-sm tracking-tight text-[#f8f9fa] flex items-center gap-1.5">
        MD <span class="text-[#fd8d0d]">→</span> Social
      </h1>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-3">
      <!-- Handle Input in Header -->
      <div class="flex items-center gap-1.5 bg-[#212529] px-2.5 py-1 rounded border border-[#2c3138]">
        <span class="text-xs text-[#adb5bd]">Handle:</span>
        <input id="author-handle-input" type="text" value="@amal" class="bg-transparent text-xs text-[#f8f9fa] w-24 focus:outline-none font-semibold placeholder-[#6c757d]" placeholder="@handle">
      </div>

      <!-- Aspect Ratio Switcher -->
      <div class="bg-[#212529] p-0.5 rounded border border-[#2c3138] flex items-center">
        <button id="ratio-4-5-btn" class="ratio-btn px-2.5 py-1 rounded text-xs font-semibold flex items-center gap-1 transition-all bg-[#fd8d0d] text-[#212529]">
          <i data-lucide="rectangle-vertical" class="w-3 h-3"></i>
          <span>4:5</span>
        </button>
        <button id="ratio-1-1-btn" class="ratio-btn px-2.5 py-1 rounded text-xs font-semibold flex items-center gap-1 transition-all text-[#adb5bd] hover:text-white">
          <i data-lucide="square" class="w-3 h-3"></i>
          <span>1:1</span>
        </button>
      </div>

      <!-- Hidden File Input for .md Import -->
      <input type="file" id="file-import-input" accept=".md,.markdown,.txt" class="hidden">

      <!-- Import .md Button -->
      <button id="import-md-btn" class="px-3 py-1 rounded bg-[#212529] hover:bg-[#2c3138] border border-[#2c3138] text-[#f8f9fa] text-xs font-semibold flex items-center gap-1.5 transition-all" title="Import local .md file">
        <i data-lucide="upload" class="w-3.5 h-3.5 text-[#fd8d0d]"></i>
        <span>Import .md</span>
      </button>

      <!-- Load Sample Button -->
      <button id="load-sample-btn" class="px-3 py-1 rounded bg-[#212529] hover:bg-[#2c3138] border border-[#2c3138] text-[#adb5bd] hover:text-white text-xs font-semibold flex items-center gap-1.5 transition-all">
        <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
        <span>Sample</span>
      </button>

      <!-- Export All (ZIP) -->
      <button id="download-zip-btn" class="px-3.5 py-1 rounded bg-[#fd8d0d] hover:bg-[#e07b09] text-[#212529] text-xs font-bold flex items-center gap-1.5 shadow transition-all">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Export (ZIP)</span>
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="flex-1 grid grid-cols-12 overflow-hidden">
    
    <!-- Left Sidebar: Markdown Editor (5 cols) -->
    <aside class="col-span-5 border-r border-[#2c3138] bg-[#1c1f24] flex flex-col h-full overflow-hidden">
      
      <!-- Editor Toolbar -->
      <div class="h-10 border-b border-[#2c3138] px-4 flex items-center justify-between shrink-0 bg-[#181a1e]">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-[#adb5bd]">Markdown Body</span>
          <span id="stats-badge" class="text-[11px] text-[#adb5bd]">0 words • 0 slides</span>
        </div>
        
        <button id="insert-split-btn" title="Insert explicit slide break" class="text-xs text-[#fd8d0d] hover:underline font-semibold flex items-center gap-1">
          <i data-lucide="scissors" class="w-3 h-3"></i>
          <span>Insert Split (---)</span>
        </button>
      </div>

      <!-- Drag and Drop Dropzone / Textarea -->
      <div id="editor-dropzone" class="flex-1 relative p-3 flex flex-col gap-2 overflow-y-auto">
        <!-- Cover Title Input -->
        <div class="flex items-center gap-2 bg-[#212529] px-2.5 py-1.5 rounded border border-[#2c3138] shrink-0">
          <span class="text-xs text-[#adb5bd] whitespace-nowrap">Title:</span>
          <input id="cover-title-input" type="text" class="bg-transparent text-xs text-[#f8f9fa] flex-1 focus:outline-none font-bold placeholder-[#6c757d]" placeholder="Cover slide title...">
        </div>

        <!-- Cover Subtitle Input -->
        <div class="flex items-center gap-2 bg-[#212529] px-2.5 py-1.5 rounded border border-[#2c3138] shrink-0">
          <span class="text-xs text-[#adb5bd] whitespace-nowrap">Subtitle:</span>
          <input id="cover-subtitle-input" type="text" class="bg-transparent text-xs text-[#f8f9fa] flex-1 focus:outline-none placeholder-[#6c757d]" placeholder="Cover slide subtitle / hook (optional)...">
        </div>

        <!-- Final Slide / Outro Text Input -->
        <div class="flex flex-col gap-1 bg-[#212529] px-2.5 py-1.5 rounded border border-[#2c3138] shrink-0">
          <div class="flex items-center justify-between">
            <span class="text-xs text-[#adb5bd] whitespace-nowrap font-medium">Final Slide Text:</span>
            <span class="text-[10px] text-[#6c757d]">markdown supported</span>
          </div>
          <textarea id="outro-text-input" rows="3" class="bg-transparent text-xs text-[#f8f9fa] w-full focus:outline-none resize-none placeholder-[#6c757d] font-mono leading-relaxed" placeholder="Custom message / sign-off for the final slide..."></textarea>
        </div>
        
        <textarea id="markdown-input" class="w-full flex-1 min-h-[180px] bg-[#212529] text-[#f8f9fa] placeholder-[#6c757d] text-sm font-mono p-3 rounded border border-[#2c3138] focus:border-[#fd8d0d] focus:outline-none resize-none transition-all" placeholder="Paste your markdown here, or drag & drop a .md file..."></textarea>
      </div>

      <!-- Quick Sliders (Font size & Padding) -->
      <div class="border-t border-[#2c3138] px-4 py-2.5 bg-[#181a1e] flex items-center justify-between gap-4 text-xs">
        <div class="flex items-center gap-2 flex-1">
          <span class="text-[#adb5bd] text-[11px] whitespace-nowrap">Size:</span>
          <input id="font-size-slider" type="range" min="30" max="60" value="44" class="w-full accent-[#fd8d0d] cursor-pointer">
          <span id="font-size-val" class="text-[#fd8d0d] text-[11px] font-mono w-8">44px</span>
        </div>

        <div class="flex items-center gap-2 flex-1">
          <span class="text-[#adb5bd] text-[11px] whitespace-nowrap">Pad:</span>
          <input id="padding-slider" type="range" min="60" max="150" step="5" value="100" class="w-full accent-[#fd8d0d] cursor-pointer">
          <span id="padding-val" class="text-[#fd8d0d] text-[11px] font-mono w-10">100px</span>
        </div>
      </div>
    </aside>

    <!-- Right: Live Preview Gallery (7 cols) -->
    <main class="col-span-7 bg-[#16181b] flex flex-col h-full overflow-hidden relative">
      
      <!-- Subbar -->
      <div class="h-10 bg-[#1c1f24] border-b border-[#2c3138] px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-[#f8f9fa]">Preview</span>
          <span id="slide-count-badge" class="text-xs text-[#adb5bd] bg-[#212529] border border-[#2c3138] px-2 py-0.5 rounded">0 slides</span>
        </div>

        <div class="flex items-center gap-2 text-xs text-[#adb5bd]">
          <span>Zoom:</span>
          <select id="preview-zoom" class="bg-[#212529] text-[#f8f9fa] text-xs px-2 py-0.5 rounded border border-[#2c3138] focus:outline-none">
            <option value="0.28">28%</option>
            <option value="0.35" selected>35%</option>
            <option value="0.45">45%</option>
          </select>
        </div>
      </div>

      <!-- Slide Viewport -->
      <div id="slides-viewport" class="flex-1 overflow-y-auto p-6 flex flex-wrap gap-6 justify-center items-start content-start">
        <!-- Rendered slide cards -->
      </div>

      <!-- Export Spinner -->
      <div id="export-modal" class="hidden absolute inset-0 bg-black/75 z-50 flex flex-col items-center justify-center gap-3">
        <div class="w-10 h-10 border-4 border-[#fd8d0d] border-t-transparent rounded-full animate-spin"></div>
        <div class="text-center">
          <h3 id="export-status-title" class="font-bold text-[#f8f9fa] text-sm">Rendering High-Res Slides...</h3>
          <p id="export-status-desc" class="text-xs text-[#adb5bd] mt-1">Generating canvases (0 / 0)</p>
        </div>
      </div>

    </main>

  </div>

  <!-- Offscreen DOM Measuring Sandbox for Zero-Clip Auto Packing -->
  <div id="measuring-sandbox">
    <div id="sandbox-card" class="slide-canvas ratio-4-5">
      <div id="sandbox-header" class="slide-header"></div>
      <div id="sandbox-content" class="slide-content"></div>
      <div id="sandbox-footer" class="slide-footer"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
